<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Six Pockets</title>
    <meta
      name="description"
      content="Six Pockets: a tiny browser pool game --- sink the three balls before you run out of shots."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Six Pockets</h1>
      <div class="game">
        <div class="table" aria-hidden="true">
          <div class="pocket pocket--top-left"></div>
          <div class="pocket pocket--top-mid"></div>
          <div class="pocket pocket--top-right"></div>
          <div class="pocket pocket--bottom-left"></div>
          <div class="pocket pocket--bottom-mid"></div>
          <div class="pocket pocket--bottom-right"></div>
          <div class="ball ball--target ball--target-1"></div>
          <div class="ball ball--target ball--target-2"></div>
          <div class="ball ball--target ball--target-3"></div>
          <div class="ball ball--cue"></div>
        </div>
        <div class="hud">
          <span class="hud-status">Shots left: 10</span>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
